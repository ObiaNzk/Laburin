# Local Postgres and Redis for development. Credentials are local-only placeholders.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: laburin
      POSTGRES_PASSWORD: laburin
      POSTGRES_DB: laburin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
volumes:
  pgdata: {}
